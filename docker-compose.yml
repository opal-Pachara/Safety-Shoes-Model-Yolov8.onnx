version: '3.8'

services:
  safety-shoes-detector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safety-shoes-detector-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - MODEL_PATH=/app/exported_models/best.onnx
      - CORS_ORIGINS=http://localhost:8000,http://localhost:5173,http://localhost:3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
